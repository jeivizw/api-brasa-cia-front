<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos - Brasa & Cia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'barlow': ['Barlow', 'sans-serif'] },
                    colors: {
                        primary: '#ca3c3f',
                        dark: '#222222',
                        success: '#22c55e',
                        warning: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Barlow', sans-serif; background-color: #f4f4f4; }
        .order-card { transition: all 0.3s ease; }
        .status-badge { @apply px-3 py-1 rounded-full text-xs font-bold uppercase; }
    </style>
</head>
<body class="text-dark">

    <header class="bg-dark text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-primary p-2 rounded-lg">
                    <img src="assets/images/logo.png" alt="Logo" class="h-8" onerror="this.style.display='none'">
                </div>
                <h1 class="text-xl font-extrabold tracking-tight">PAINEL DE PEDIDOS <span class="text-primary">| BRASA & CIA</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="relogio" class="font-mono bg-black/30 px-3 py-1 rounded text-sm">00:00:00</span>
                <div class="relative">
                    <span class="absolute -top-1 -right-1 bg-primary text-white text-[10px] w-4 h-4 flex justify-center items-center rounded-full animate-bounce" id="count-badge">0</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8">
        <div class="flex gap-4 mb-8 overflow-x-auto pb-2">
            <button onclick="filtrarPedidos('todos')" class="bg-dark text-white px-6 py-2 rounded-xl font-bold whitespace-nowrap">Todos</button>
            <button onclick="filtrarPedidos('pendente')" class="bg-white border border-gray-200 px-6 py-2 rounded-xl font-bold hover:bg-gray-50 whitespace-nowrap">Pendentes</button>
            <button onclick="filtrarPedidos('preparo')" class="bg-white border border-gray-200 px-6 py-2 rounded-xl font-bold hover:bg-gray-50 whitespace-nowrap">Em Preparo</button>
            <button onclick="filtrarPedidos('entrega')" class="bg-white border border-gray-200 px-6 py-2 rounded-xl font-bold hover:bg-gray-50 whitespace-nowrap">Saiu para Entrega</button>
        </div>

        <div id="grid-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center text-gray-400">
                <p>Aguardando novos pedidos...</p>
            </div>
        </div>
    </main>

    <div id="modal-pedido" class="fixed inset-0 bg-black/50 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl">
            <div id="modal-content"></div>
            <button onclick="fecharModal()" class="mt-6 w-full py-3 bg-gray-200 rounded-xl font-bold text-dark">Fechar</button>
        </div>
    </div>

    <script>
        // Começamos com a lista de pedidos vazia (ela virá do banco de dados)
        let pedidos = [];
        
        // URL da sua API do Back-end local
        const API_URL = 'https://back-brasa-cia.vercel.app/api';

        // ✨ FUNÇÃO QUE BUSCA OS PEDIDOS REAIS DO BANCO DE DADOS
        async function carregarPedidosDoBanco() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                
                pedidos = await response.json();
                renderizarPedidos(); // Atualiza a tela com os dados reais
            } catch (error) {
                console.error('Erro ao buscar pedidos do banco:', error);
            }
        }

        function renderizarPedidos(lista = pedidos) {
            const grid = document.getElementById('grid-pedidos');
            const badge = document.getElementById('count-badge');
            
            // Conta quantos estão pendentes na lista atual
            badge.innerText = pedidos.filter(p => p.status === 'pendente').length;
            
            grid.innerHTML = '';

            if (lista.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center text-gray-400">
                        <p>Nenhum pedido encontrado nesta seção.</p>
                    </div>`;
                return;
            }

            lista.forEach(p => {
                const statusCores = {
                    pendente: "bg-red-100 text-red-600",
                    preparo: "bg-warning/20 text-warning",
                    entrega: "bg-blue-100 text-blue-600",
                    concluido: "bg-success/20 text-success"
                };

                const card = document.createElement('div');
                card.className = "order-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md";
                
                // Identifica se o pedido é para retirada no balcão
                const ehRetirada = p.retirada === true || p.cliente_endereco === "RETIRADA NO BALCÃO";

                // Proteção contra erro .toFixed() se a localização vier nula ou se for retirada
                const textoLocalizacao = ehRetirada 
                    ? `<b>Tipo:</b> <span class="text-red-600 font-bold uppercase">Retirada no Balcão</span>` 
                    : `<b>Localização:</b> ${(p.localizacao && p.localizacao.lat) ? Number(p.localizacao.lat).toFixed(4) : '0'}, ${(p.localizacao && p.localizacao.lon) ? Number(p.localizacao.lon).toFixed(4) : '0'}`;

                // Altera dinamicamente o texto do botão de despacho se for retirada
                const botaostatusEntrega = ehRetirada
                    ? `<button onclick="alterarStatus('${p.id}', 'entrega')" class="bg-blue-500 text-white py-2 rounded-lg text-xs font-bold hover:opacity-90">PRONTO P/ RETIRAR</button>`
                    : `<button onclick="alterarStatus('${p.id}', 'entrega')" class="bg-blue-500 text-white py-2 rounded-lg text-xs font-bold hover:opacity-90">SAIU ENTREGA</button>`;

                // Troca o botão de GPS por um alerta pulsante bem visível para a gerência/painel
                const botaoMapaOuAviso = ehRetirada
                    ? `<div class="col-span-2 text-center bg-[#ca3c3f] text-white py-2 rounded-lg text-xs font-bold animate-pulse tracking-wider">🚨 RETIRADA NO BALCÃO</div>`
                    : `<button onclick="abrirMapa(${p.localizacao?.lat || 0}, ${p.localizacao?.lon || 0})" class="col-span-2 border border-dark text-dark py-2 rounded-lg text-xs font-bold hover:bg-dark hover:text-white transition-colors">VER NO MAPA (GPS)</button>`;

                // Transforma em array caso os itens venham como objeto direto do banco
                const listaItens = Array.isArray(p.itens) ? p.itens : [];

                card.innerHTML = `
                    <div class="p-4 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                        <div>
                            <span class="text-xs text-gray-400 block uppercase font-bold">Pedido #${p.id}</span>
                            <h3 class="font-bold text-lg">${p.cliente}</h3>
                        </div>
                        <span class="status-badge ${statusCores[p.status]}">${p.status}</span>
                    </div>
                    
                    <div class="p-4 flex-1">
                        <ul class="space-y-2 mb-4">
                            ${listaItens.map(item => `
                                <li class="flex justify-between text-sm">
                                    <span><b class="text-primary">${item.qtd}x</b> ${item.nome}</span>
                                    <span class="font-medium text-gray-500">R$ ${Number(item.preco).toFixed(2)}</span>
                                </li>
                            `).join('')}
                        </ul>
                        
                        <div class="bg-gray-50 rounded-xl p-3 text-xs text-gray-500 mb-4">
                            <p><b>Hora:</b> ${p.hora}</p>
                            <p><b>Tel:</b> ${p.telefone}</p>
                            <p class="truncate">${textoLocalizacao}</p>
                        </div>

                        <div class="flex justify-between items-center mb-4">
                            <span class="text-gray-400 font-bold">TOTAL</span>
                            <span class="text-xl font-black text-primary">R$ ${Number(p.total).toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50 grid grid-cols-2 gap-2">
                        <button onclick="alterarStatus('${p.id}', 'preparo')" class="bg-warning text-white py-2 rounded-lg text-xs font-bold hover:opacity-90">PREPARAR</button>
                        ${botaostatusEntrega}
                        ${botaoMapaOuAviso}
                        <button onclick="alterarStatus('${p.id}', 'concluido')" class="col-span-2 bg-success text-white py-2 rounded-lg text-xs font-bold hover:opacity-90">CONCLUIR PEDIDO</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ✨ ATUALIZADO PARA ENVIAR A MUDANÇA DE STATUS PARA O SEU BACK-END / SUPABASE
        async function alterarStatus(id, novoStatus) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });

                if (response.ok) {
                    // Atualiza localmente o status do pedido modificado para atualizar a tela sem delay
                    const index = pedidos.findIndex(p => p.id === id);
                    if (index !== -1) {
                        pedidos[index].status = novoStatus;
                        renderizarPedidos();
                    }
                    console.log(`Pedido ${id} atualizado com sucesso no Supabase para: ${novoStatus}`);
                } else {
                    console.error('Erro ao atualizar o status no servidor');
                }
            } catch (error) {
                console.error('Erro na requisição para o servidor:', error);
            }
        }

        // Link oficial corrigido para abrir o marcador do GPS real no Google Maps
        function abrirMapa(lat, lon) {
            if(lat === 0 && lon === 0) return alert("Localização indisponível.");
            window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
        }

        function filtrarPedidos(status) {
            if (status === 'todos') {
                renderizarPedidos(pedidos);
            } else {
                const filtrados = pedidos.filter(p => p.status === status);
                renderizarPedidos(filtrados);
            }
        }

        // Relógio do Painel
        setInterval(() => {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // ✨ Chamada inicial para buscar os dados vivos assim que abre a página
        carregarPedidosDoBanco();

        // ✨ Configura o painel para atualizar sozinho a cada 10 segundos buscando novas compras
        setInterval(carregarPedidosDoBanco, 10000);

    </script>
</body>
</html>
